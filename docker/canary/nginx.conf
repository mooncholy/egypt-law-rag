# The canary split (Phase 12): 95% of requests to the stable API, 5% to the
# canary. Each request is drawn on its own ($request_id), so one client sees
# both; hash on $remote_addr instead to keep a client on one version.
# Every response carries X-Raglaw-Variant (stable or canary) from here and
# X-Raglaw-Version from the API that served it.

split_clients "${request_id}" $variant {
    95%     stable;
    *       canary;
}

map $variant $backend {
    stable  api-stable:8000;
    canary  api-canary:8000;
}

server {
    listen 8080;
    resolver 127.0.0.11 valid=10s;  # Docker's DNS, so a recreated API is found

    location / {
        proxy_pass http://$backend;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 300s;
        proxy_buffering off;  # /ask/stream's events pass through as they come
        add_header X-Raglaw-Variant $variant always;
    }
}
