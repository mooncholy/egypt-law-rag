# Canary override (Phase 12): two API versions behind nginx, 95/5.
#   RAGLAW_STABLE_TAG=0.1.0 RAGLAW_CANARY_TAG=latest \
#     docker compose -f compose.yaml -f docker/compose.canary.yml up
# (add -f docker/compose.gpu.yml before this file on a GPU). Ask on port 8080;
# each response says which version served it. The rollout stages are in the
# README, "Canary rollout". `api` itself still runs on 8000 for direct checks.

x-api: &api
  environment:
    RAGLAW_MODELS_URL: http://models:8001
    RAGLAW_MODELS_WAIT_SECONDS: "600"
    RAGLAW_LLM_BASE_URL: ${RAGLAW_CANARY_LLM_BASE_URL:-http://ollama:11434/v1}
    RAGLAW_LLM_MODEL: ${RAGLAW_CANARY_LLM_MODEL:-qwen2.5:7b-instruct-q8_0}
    RAGLAW_LLM_API_KEY: ollama
  depends_on:
    models:
      condition: service_healthy
  restart: unless-stopped

services:
  api-stable:
    <<: *api
    image: mooncholy/raglaw-api:${RAGLAW_STABLE_TAG:-0.1.0}

  api-canary:
    <<: *api
    image: mooncholy/raglaw-api:${RAGLAW_CANARY_TAG:-latest}

  canary:
    image: nginx:1.29.3-alpine@sha256:b3c656d55d7ad751196f21b7fd2e8d4da9cb430e32f646adcf92441b72f82b14
    volumes:
      - ./docker/canary/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api-stable
      - api-canary
    restart: unless-stopped
