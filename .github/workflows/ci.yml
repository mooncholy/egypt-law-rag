# CI contract: every change headed for an integration branch is proven to be
# clean, reproducible from uv.lock, tested and servable from the runtime
# dependencies alone (GitHub's runners, no credentials), and then, on the
# project's self-hosted GPU runner, to rebuild the index, keep answer and
# retrieval quality above the gate, and build the images it would ship.
#
# - The first three jobs use only what's committed. No secrets, no S3, no
#   `dvc pull` (D6): tests needing the full PDF (`profile`, `corpus`) skip.
# - `deliver` runs on the owner's machine (D24): it reaches the DVC remote, the
#   tracking server, the GPU and the LLMs with that machine's settings
#   (~/.config/raglaw/ci.env), so no secret is stored in GitHub. It never runs
#   for a fork's pull request.
# - Python comes from .python-version, uv from [tool.uv] required-version, and
#   every install uses --locked, so a stale uv.lock fails the run.
name: ci

on:
  pull_request:
  push:
    branches: [main, feat-civil-law-chatbot]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint (pre-commit hooks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          # Read the cache `test` saves (its full install covers this job's); only
          # one job writes, since all three share the same uv.lock-based key.
          save-cache: false
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # pre-commit alone; the hooks install their own tools.
      - run: uv sync --locked --only-group dev
      # The same hooks as a local commit, over every file. The DVC hook needs
      # the data and DVC itself, neither of which CI has.
      - run: uv run --no-sync pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: dvc-pre-commit

  test:
    name: test (unit, coverage gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      # The 80% threshold lives in [tool.coverage.report]; --cov applies it.
      - run: uv run --no-sync pytest -m unit --cov

  runtime:
    name: runtime (API on runtime deps only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          # Read the cache `test` saves (its full install covers this job's); only
          # one job writes, since all three share the same uv.lock-based key.
          save-cache: false
      - run: uv sync --locked --no-default-groups
      # Fails if the API imports anything outside the runtime group, or can't
      # serve. No LLM, models service or registry here, so it reports "degraded".
      - name: Serve /health
        run: |
          uv run --no-sync uvicorn raglaw.api.main:app --port 8000 &
          for _ in $(seq 1 30); do
            curl -sf localhost:8000/health >/dev/null && break
            sleep 1
          done
          curl -sf localhost:8000/health | tee /dev/stderr \
            | uv run --no-sync python -c "import json, sys; assert json.load(sys.stdin)['status'] in ('healthy', 'degraded')"

  deliver:
    name: index, quality gate and images (self-hosted GPU)
    needs: [lint, test, runtime]
    # Branches of this repository only: a fork's code never reaches this machine.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, raglaw-gpu]
    timeout-minutes: 60
    env:
      UV_GPU: --no-group torch-cpu --group torch-gpu
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the base branch's committed metrics, for the gate
      - name: This machine's settings (outside the repo)
        run: cp "$HOME/.config/raglaw/ci.env" .env
      - name: Install with CUDA torch
        run: uv sync --locked $UV_GPU
      - name: Pull the data (DVC remote)
        run: uv run --no-sync dvc pull
      - name: Rebuild the index (embed, bm25)
        run: uv run --no-sync dvc repro --force embed bm25
      - name: Retrieval on the tuning half
        run: uv run --no-sync dvc repro --force --single-item evaluate_retrieval
      - name: Answers on the 20-question CI set (RAGAS)
        run: >-
          uv run --no-sync dvc exp run -n "ci-${GITHUB_RUN_ID}" -s evaluate_answers
          -S answer_evaluation.subset=ci
      - name: Quality gate
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          git show "$base:docs/metrics/retrieval.json" > "$RUNNER_TEMP/base_retrieval.json" \
            || rm -f "$RUNNER_TEMP/base_retrieval.json"
          uv run --no-sync python scripts/ci_gate.py --base-retrieval "$RUNNER_TEMP/base_retrieval.json"
      - name: Export the production retriever (D26)
        run: rm -rf build/champion && uv run --no-sync python -m raglaw.retrieval.champion export
      - name: Build the images
        run: RAGLAW_IMAGE_TAG="sha-${GITHUB_SHA::7}" docker compose build api models
      - name: Push the images (merges only)
        if: github.event_name == 'push'
        run: |
          tag="sha-${GITHUB_SHA::7}"
          RAGLAW_IMAGE_TAG="$tag" docker compose push api models
          for image in api models; do
            docker tag "mooncholy/raglaw-$image:$tag" "mooncholy/raglaw-$image:latest"
          done
          RAGLAW_IMAGE_TAG=latest docker compose push api models
