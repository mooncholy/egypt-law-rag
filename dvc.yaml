# The corpus build: profile -> extract -> repair -> assemble -> validate -> chunk,
# then the search index: embed and bm25, scored by evaluate_retrieval.
# Paths come from params.yaml through ${...}; each stage lists the code that
# defines what it computes, so a code change reruns it.
stages:
  profile:
    cmd: python -m raglaw.ingest.profile
    deps:
      - ${paths.raw_pdf}
      - src/raglaw/ingest/profile.py
      - src/raglaw/ingest/measure.py
      - src/raglaw/ingest/table.py
    outs:
      - ${paths.analysis_dir}:
          cache: false
    metrics:
      - ${paths.metrics_dir}/source_profile.json:
          cache: false

  extract:
    cmd: python -m raglaw.ingest.extract
    deps:
      - ${paths.raw_pdf}
      - ${paths.metrics_dir}/source_profile.json
      - src/raglaw/ingest/extract.py
      - src/raglaw/ingest/glyphs.py
      - src/raglaw/ingest/table.py
      - src/raglaw/ingest/measure.py
      - src/raglaw/ingest/profile.py
      - src/raglaw/schema.py
      - src/raglaw/records.py
    outs:
      - ${paths.interim_dir}/rows.jsonl
    metrics:
      - ${paths.metrics_dir}/extract.json:
          cache: false

  repair:
    cmd: python -m raglaw.ingest.repair
    deps:
      - ${paths.interim_dir}/rows.jsonl
      - ${paths.errata}
      - src/raglaw/ingest/repair.py
      - src/raglaw/ingest/errata.py
      - src/raglaw/ingest/measure.py
      - src/raglaw/ingest/profile.py
      - src/raglaw/schema.py
      - src/raglaw/records.py
    outs:
      - ${paths.interim_dir}/rows_repaired.jsonl
    metrics:
      - ${paths.metrics_dir}/repair.json:
          cache: false

  assemble:
    cmd: python -m raglaw.ingest.assemble
    deps:
      - ${paths.interim_dir}/rows_repaired.jsonl
      - src/raglaw/ingest/assemble.py
      - src/raglaw/ingest/measure.py
      - src/raglaw/text/normalize.py
      - src/raglaw/schema.py
      - src/raglaw/records.py
    params:
      - root_heading
    outs:
      - ${paths.corpus_dir}/articles.json
      - ${paths.reports_dir}/heading_tree.txt:
          cache: false
    metrics:
      - ${paths.metrics_dir}/assemble.json:
          cache: false

  # Re-measures the corpus (C1-C16) and compares it with the gold sample
  # (Phase 4). Nothing downstream reads its outputs; it fails on any check.
  validate:
    cmd: python -m raglaw.ingest.validate
    deps:
      - ${paths.corpus_dir}/articles.json
      - ${paths.interim_dir}/rows_repaired.jsonl
      - ${paths.gold_dir}/articles_gold.json
      - ${paths.errata}
      - ${paths.metrics_dir}/extract.json
      - ${paths.metrics_dir}/repair.json
      - ${paths.metrics_dir}/assemble.json
      - src/raglaw/ingest/validate.py
      - src/raglaw/ingest/assemble.py
      - src/raglaw/ingest/extract.py
      - src/raglaw/ingest/repair.py
      - src/raglaw/ingest/measure.py
      - src/raglaw/text/normalize.py
      - src/raglaw/schema.py
      - src/raglaw/records.py
    params:
      - root_heading
    outs:
      - ${paths.reports_dir}/corpus_validation.md:
          cache: false
    metrics:
      - ${paths.metrics_dir}/corpus.json:
          cache: false

  chunk:
    cmd: python -m raglaw.ingest.chunk
    deps:
      - ${paths.corpus_dir}/articles.json
      - src/raglaw/ingest/chunk.py
      - src/raglaw/ingest/loader.py
      - src/raglaw/retrieval/embeddings.py
      - src/raglaw/schema.py
      - src/raglaw/records.py
    params:
      - chunking
      - embedding
    outs:
      - ${paths.corpus_dir}/chunks.json
    metrics:
      - ${paths.metrics_dir}/chunks.json:
          cache: false

  # The search index, in two halves under ${paths.index_dir}, so a BM25
  # tokenizer change takes seconds and never re-embeds (15 min on CPU).
  # `device` comes from the environment, not params.yaml, so DVC can't see it:
  # the dense manifest records it instead, and `dvc repro -f embed` rebuilds
  # the index on another device.
  embed:
    cmd: python -m raglaw.ingest.embed
    deps:
      - ${paths.corpus_dir}/chunks.json
      - src/raglaw/ingest/embed.py
      - src/raglaw/retrieval/dense.py
      - src/raglaw/retrieval/document_text.py
      - src/raglaw/retrieval/embeddings.py
      - src/raglaw/retrieval/manifest.py
      - src/raglaw/schema.py
      - src/raglaw/records.py
    params:
      - embedding
      - retrieval.document_text
      - retrieval.repealed_text
    outs:
      - ${paths.index_dir}/dense
    metrics:
      - ${paths.metrics_dir}/embed.json:
          cache: false

  bm25:
    cmd: python -m raglaw.ingest.bm25
    deps:
      - ${paths.corpus_dir}/chunks.json
      - src/raglaw/ingest/bm25.py
      - src/raglaw/retrieval/document_text.py
      - src/raglaw/retrieval/embeddings.py  # the model tokenizer, for model_subwords
      - src/raglaw/retrieval/lexical.py
      - src/raglaw/retrieval/manifest.py
      - src/raglaw/retrieval/tokenize.py
      - src/raglaw/text/normalize.py
      - src/raglaw/schema.py
      - src/raglaw/records.py
    params:
      - embedding  # names the tokenizer model_subwords uses
      - retrieval.document_text
      - retrieval.bm25_tokenizer
      - retrieval.bm25_stopwords
      - retrieval.repealed_text
    outs:
      - ${paths.index_dir}/bm25
    metrics:
      - ${paths.metrics_dir}/bm25.json:
          cache: false

  # Scores one half of the eval set (evaluation.split, D15) before any LLM is
  # involved. One MLflow run per config, in the `retrieval` experiment.
  evaluate_retrieval:
    cmd: python -m raglaw.ingest.evaluate_retrieval
    deps:
      - ${paths.index_dir}/dense
      - ${paths.index_dir}/bm25
      - ${paths.gold_dir}/retrieval_eval.jsonl
      - ${paths.repealed}
      - src/raglaw/ingest/evaluate_retrieval.py
      - src/raglaw/retrieval/dense.py
      - src/raglaw/retrieval/embeddings.py
      - src/raglaw/retrieval/fusion.py
      - src/raglaw/retrieval/lexical.py
      - src/raglaw/retrieval/lookup.py
      - src/raglaw/retrieval/manifest.py
      - src/raglaw/retrieval/repealed.py
      - src/raglaw/retrieval/rerank.py
      - src/raglaw/retrieval/retriever.py
      - src/raglaw/retrieval/scoring.py
      - src/raglaw/retrieval/tokenize.py
      - src/raglaw/text/normalize.py
    params:
      - chunking   # logged with each run, so runs compare by it
      - embedding
      - reranker
      - retrieval
      - search
      - evaluation
    metrics:
      - ${paths.metrics_dir}/retrieval.json:
          cache: false
    outs:
      - ${paths.reports_dir}/retrieval_misses.md:
          cache: false
      - ${paths.reports_dir}/retrieval_questions.json:
          cache: false

  # RAGAS scores for /ask's answers (Phase 9): the generator and the judge are
  # per-machine endpoints in .env (RAGLAW_LLM_*, RAGLAW_JUDGE_*), which DVC
  # can't see; each run logs both. Needs both endpoints to run.
  evaluate_answers:
    cmd: python -m raglaw.ingest.evaluate_answers
    deps:
      - ${paths.index_dir}/dense
      - ${paths.index_dir}/bm25
      - ${paths.gold_dir}/answer_eval.jsonl
      - ${paths.gold_dir}/retrieval_eval.jsonl
      - ${paths.repealed}
      - src/raglaw/answer_eval.py
      - src/raglaw/ingest/evaluate_answers.py
      - src/raglaw/ingest/evaluate_retrieval.py
      - src/raglaw/llm.py
      - src/raglaw/prompts
      - src/raglaw/rag.py
      - src/raglaw/retrieval/dense.py
      - src/raglaw/retrieval/embeddings.py
      - src/raglaw/retrieval/fusion.py
      - src/raglaw/retrieval/lexical.py
      - src/raglaw/retrieval/lookup.py
      - src/raglaw/retrieval/manifest.py
      - src/raglaw/retrieval/repealed.py
      - src/raglaw/retrieval/rerank.py
      - src/raglaw/retrieval/retriever.py
      - src/raglaw/retrieval/scoring.py
      - src/raglaw/retrieval/tokenize.py
      - src/raglaw/text/normalize.py
    params:
      - chunking
      - embedding
      - reranker
      - retrieval
      - search
      - answer
      - answer_evaluation
    metrics:
      - ${paths.metrics_dir}/answers.json:
          cache: false
    outs:
      - ${paths.reports_dir}/answer_eval.md:
          cache: false
      - ${paths.reports_dir}/answer_questions.json:
          cache: false
