# Tracked project parameters, read by raglaw.config.Settings and, from Phase 1,
# by dvc.yaml through ${...} (e.g. ${paths.raw_pdf}). Changing a value here is
# a reviewed change, and `dvc repro` reruns the stages that depend on it.
# Per-machine and secret values (API key, bucket, MLflow URI) go in .env instead.

# Relative to the repo root, where `dvc repro` runs its stages.
paths:
  raw_pdf: data/raw/civil_code.pdf
  errata: data/errata.yaml
  interim_dir: data/interim
  corpus_dir: data/corpus
  gold_dir: data/gold
  metrics_dir: docs/metrics
  reports_dir: docs/reports
  analysis_dir: docs/analysis/source_pdf
  index_dir: data/index
  logs_dir: logs

# The page 1 heading that opens every heading path (P7). It has no English side
# in the source; the owner supplies the label (D7).
root_heading:
  ar: باب تمهيدي / أحكام عامة
  en: Preliminary Chapter / General Provisions

# MLflow: one experiment per kind of work, since runs are compared within one.
# Not a stage input: never list these under a stage's `params:` in dvc.yaml.
tracking:
  experiments:
    corpus: corpus-build   # one run per `dvc repro` stage execution
    retrieval: retrieval   # one run per retrieval config evaluated

chunking:
  strategy: structural
  max_chars: 1000
  semantic:
    breakpoint_percentile: 90   # A starting value, could be changed later based on retrieval evaluation
  repealed: per_article   # | per_range: one chunk per repealed range (54-80, 389-417)

# The one embedding model (D12): the semantic chunking variant and `embed` both
# read it, so the two can't drift apart.
embedding:
  model: BAAI/bge-m3
  revision: 5617a9f61b028005a4858fdac845db406aefb181
  batch_size: 32

# The cross-encoder for `search.rerank`: multilingual (Arabic included), from
# the same family as the embedder, revision pinned like D12's.
reranker:
  model: BAAI/bge-reranker-v2-m3
  revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
  max_length: 1024
  batch_size: 8

# What `embed` and `bm25` index per chunk, and how `bm25` splits it into terms.
# Each alternative is a measured variant (`dvc exp run -S retrieval.<key>=...`).
retrieval:
  document_text: both_with_headings   # D14, the owner's default
  bm25_tokenizer: words               # | words_light_stem | model_subwords
  bm25_stopwords: none                # | lucene (33 words) | nltk (179, incl. question words)
  repealed_text: note                 # | heading: a repealed article searched by its headings only

# How a question searches the index, at query time: changing these never
# rebuilds the index. Each is a measured choice (D17 after the baseline).
search:
  mode: hybrid          # | dense | bm25
  article_lookup: true  # a named article is fetched directly and ranked first
  candidates: 50        # hits each retriever returns before fusion
  rrf_k: 60             # Cormack et al. (2009)
  top_k: 10             # chunks returned per question
  rerank: true          # re-score the top rerank_depth fused chunks with `reranker`
  rerank_depth: 30
  cite_expansion: false # insert the articles a returned chunk cites, right after it

# How retrieval is scored (D15): configs are chosen on the tuning half; the
# chosen one is reported once on the held-out half.
evaluation:
  split: tuning   # | heldout
  target_recall_at_5: 0.9   # D17, set by the owner after the 0.57 baseline
