# Tracked project parameters, read by raglaw.config.Settings and, from Phase 1,
# by dvc.yaml through ${...} (e.g. ${paths.raw_pdf}). Changing a value here is
# a reviewed change, and `dvc repro` reruns the stages that depend on it.
# Per-machine and secret values (API key, bucket, MLflow URI) go in .env instead.

# Relative to the repo root, where `dvc repro` runs its stages.
paths:
  raw_pdf: data/raw/civil_code.pdf
  errata: data/errata.yaml
  interim_dir: data/interim
  corpus_dir: data/corpus
  gold_dir: data/gold
  metrics_dir: docs/metrics
  reports_dir: docs/reports
  analysis_dir: docs/analysis/source_pdf
  logs_dir: logs

# The page 1 heading that opens every heading path (P7). It has no English side
# in the source; the owner supplies the label (D7).
root_heading:
  ar: "باب تمهيدي / أحكام عامة"
  en: "Preliminary Chapter / General Provisions"

# MLflow: one experiment per kind of work, since runs are compared within one.
# Not a stage input: never list these under a stage's `params:` in dvc.yaml.
tracking:
  experiments:
    corpus: corpus-build   # one run per `dvc repro` stage execution

chunking:
  strategy: structural
  max_chars: 1000
  semantic:
    model: BAAI/bge-m3
    revision: 5617a9f61b028005a4858fdac845db406aefb181
    breakpoint_percentile: 90   # A starting value, could be changed later based on retrieval evaluation
    batch_size: 32
