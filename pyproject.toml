[project]
name = "egypt-law-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mooncholy", email = "m.yzh.zayn@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Plain `uv sync` / `uv run` keep the pipeline installed; the Docker image
# opts out with `uv sync --no-default-groups`.
default-groups = ["dev", "ingest"]
required-version = "==0.12.20"

# The semantic chunking variant's torch comes from the CPU-only index, so a
# sync never pulls CUDA builds. The `semantic` group is not a default group.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[tool.uv.build-backend]
module-name = "raglaw"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "langchain-huggingface>=1.2.2",
    "pdfplumber>=0.11.10",
    "pre-commit>=4.6.2",
    "pylint>=4.1.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "sentence-transformers>=6.1.0",
]
ingest = [
    "boto3>=1.43.75",
    "dvc[s3]>=3.67.1",
    "langchain-core>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "mlflow>=3.16.1",
    "pikepdf>=10.15.0",
    "pymupdf>=1.28.2",
]
semantic = [
    "langchain-huggingface>=1.2.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Raised inside MLflow's SQLAlchemy models (deprecated in SQLAlchemy 2.1);
    # not ours to fix. Every other deprecation still shows.
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
]
markers = [
    "unit: synthetic inputs (including a generated PDF), no DVC data",
    "profile: needs the DVC-tracked PDF (raw baselines)",
    "corpus: needs the DVC-tracked corpus (validate metrics)",
]

[tool.coverage.run]
source = ["raglaw"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff.lint]
# Ruff's defaults plus flake8-print: the pipeline and the API log, never print.
extend-select = ["T20"]
