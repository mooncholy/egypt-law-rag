[project]
name = "egypt-law-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mooncholy", email = "m.yzh.zayn@gmail.com" }
]
requires-python = ">=3.14"
# What the API runs on, and all the Docker image installs: retrieval over the
# index, the registry (mlflow-skinny with the pandas its pyfunc imports; sqlite
# until Phase 8; S3 artifacts) and the LLM client. No torch: the `models`
# service embeds and reranks (D18).
dependencies = [
    "alembic>=1.20.0",
    "bm25s>=0.3.13",
    "boto3>=1.43.75",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langchain-core>=1.6.7",
    "langchain-qdrant>=1.1.0",
    "mlflow-skinny>=3.16.1",
    "openai>=3.27.0",
    "pandas>=3.0.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
# Plain `uv sync` / `uv run` keep the pipeline installed, including the
# embedding model the `embed` stage needs, on CPU-only torch; the Docker image
# opts out with `uv sync --no-default-groups`. A machine with an NVIDIA GPU
# swaps torch builds with `--no-group torch-cpu --group torch-gpu` (README).
default-groups = ["dev", "ingest", "embed", "torch-cpu"]
required-version = "==0.12.20"
# One torch build per environment: CPU-only by default, CUDA 13 on request.
conflicts = [[{ group = "torch-cpu" }, { group = "torch-gpu" }]]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# CUDA 13.0 builds: the oldest torch line with Python 3.14 wheels for this
# torch version, and it covers Blackwell GPUs (compute capability 12.0).
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "torch-cpu" },
    { index = "pytorch-cu130", group = "torch-gpu" },
]

[tool.uv.build-backend]
module-name = "raglaw"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pdfplumber>=0.11.10",
    "pre-commit>=4.6.2",
    "pylint>=4.1.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
ingest = [
    "boto3>=1.43.75",
    "dvc[s3]>=3.67.1",
    "langchain-core>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "mlflow>=3.16.1",
    "pikepdf>=10.15.0",
    "pymupdf>=1.28.2",
]
# The pinned embedding model (bge-m3) and the search index (Qdrant, BM25): the
# semantic chunking variant and the `embed` and `bm25` stages. Kept out of `dev`, so the
# lint job stays light.
embed = [
    "bm25s>=0.3.13",
    "langchain-huggingface>=1.2.2",
    "langchain-qdrant>=1.1.0",
    "qdrant-client>=1.19.1",
    "sentence-transformers>=6.1.0",
]
# The torch build the embed group runs on; exactly one of the two is installed.
torch-cpu = ["torch>=2.14.1"]
torch-gpu = ["torch>=2.14.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    # Raised inside MLflow's SQLAlchemy models (deprecated in SQLAlchemy 2.1);
    # not ours to fix. Every other deprecation still shows.
    "ignore:The ``noload`` loader strategy is deprecated:DeprecationWarning",
]
markers = [
    "unit: synthetic inputs (including a generated PDF), no DVC data",
    "profile: needs the DVC-tracked PDF (raw baselines)",
    "corpus: needs the DVC-tracked corpus (validate metrics)",
]

[tool.coverage.run]
source = ["raglaw"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff.lint]
# Ruff's defaults plus flake8-print: the pipeline and the API log, never print.
extend-select = ["T20"]
